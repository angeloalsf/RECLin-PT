[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclin"
version = "0.1.0"
description = "RECLin-PT: extração de relações em notas clínicas em português, com foco em negation_of"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# As dependências entram junto com o módulo que as usa: numpy e scipy desde a
# etapa 2 (avaliação); torch e transformers desde a etapa 5 (treino). As
# versões exatas dos experimentos ficam em requirements.txt; para reproduzir os
# resultados do legado byte a byte, instale com `-c codigo/requirements.txt`
# (ver codigo/README.md).
dependencies = ["numpy>=1.24", "scipy>=1.11", "torch>=2.11", "transformers>=5.16"]

[project.optional-dependencies]
testes = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["reclin*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-p no:cacheprovider --import-mode=importlib"
markers = ["lento: testes de mais de um minuto (as 26 comparações do legado e os lotes do TRAIN); pule com -m \"not lento\""]
